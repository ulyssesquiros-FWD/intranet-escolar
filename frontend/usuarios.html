<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Intranet Escolar | Usuarios</title>

    <link
        rel="stylesheet"
        href="css/usuarios.css"
    >
</head>

<body>

    <div class="usuarios-page">

        <header class="page-header">

            <div>
                <p class="page-label">
                    Administración
                </p>

                <h1>Gestión de usuarios</h1>

                <p class="page-description">
                    Administra los usuarios registrados
                    en la Intranet Escolar.
                </p>
            </div>

            <a
                href="dashboard.html"
                class="back-button"
            >
                Volver al dashboard
            </a>

        </header>


        <main>

            <section class="toolbar">

                <div class="search-box">

                    <label for="searchInput">
                        Buscar
                    </label>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Usuario, nombre o correo..."
                    >

                </div>


                <div class="filter-box">

                    <label for="roleFilter">
                        Filtrar por rol
                    </label>

                    <select id="roleFilter">

                        <option value="todos">
                            Todos los roles
                        </option>

                        <option value="administracion">
                            Administración
                        </option>

                        <option value="docente">
                            Docente
                        </option>

                        <option value="estudiante">
                            Estudiante / Familia
                        </option>

                    </select>

                </div>


                <button
                    type="button"
                    id="newUserButton"
                    class="primary-button"
                >
                    + Nuevo usuario
                </button>

            </section>


            <section
                id="formSection"
                class="form-section"
                hidden
            >

                <div class="section-title">

                    <div>
                        <p>Registro</p>

                        <h2 id="formTitle">
                            Nuevo usuario
                        </h2>
                    </div>

                    <button
                        type="button"
                        id="cancelButton"
                        class="secondary-button"
                    >
                        Cancelar
                    </button>

                </div>


                <form id="userForm">

                    <input
                        type="hidden"
                        id="userId"
                    >


                    <div class="form-grid">

                        <div class="form-group">

                            <label for="username">
                                Usuario *
                            </label>

                            <input
                                type="text"
                                id="username"
                                required
                                maxlength="30"
                            >

                        </div>


                        <div class="form-group">

                            <label for="name">
                                Nombre completo *
                            </label>

                            <input
                                type="text"
                                id="name"
                                required
                                maxlength="80"
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Correo electrónico *
                            </label>

                            <input
                                type="email"
                                id="email"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="role">
                                Rol *
                            </label>

                            <select id="role" required>

                                <option value="">
                                    Seleccione un rol
                                </option>

                                <option value="administracion">
                                    Administración
                                </option>

                                <option value="docente">
                                    Docente
                                </option>

                                <option value="estudiante">
                                    Estudiante / Familia
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="password">
                                Contraseña *
                            </label>

                            <input
                                type="password"
                                id="password"
                                minlength="6"
                            >

                        </div>


                        <div class="form-group">

                            <label for="status">
                                Estado *
                            </label>

                            <select id="status" required>

                                <option value="activo">
                                    Activo
                                </option>

                                <option value="inactivo">
                                    Inactivo
                                </option>

                            </select>

                        </div>

                    </div>


                    <div
                        id="formMessage"
                        class="form-message"
                        role="alert"
                    ></div>


                    <div class="form-actions">

                        <button
                            type="submit"
                            class="primary-button"
                        >
                            Guardar usuario
                        </button>

                        <button
                            type="button"
                            id="cancelButtonBottom"
                            class="secondary-button"
                        >
                            Cancelar
                        </button>

                    </div>

                </form>

            </section>


            <section class="users-section">

                <div class="section-title">

                    <div>
                        <p>Usuarios registrados</p>

                        <h2>Listado</h2>
                    </div>

                    <span id="userCounter">
                        0 usuarios
                    </span>

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                            <tr>
                                <th>Usuario</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>

                        </thead>

                        <tbody id="usersTableBody">
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="./js/usuarios.js"></script>

</body>

</html>
